<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <!-- 作者：胡文豪 | 建立时间：2026-11-18 18:13:32 | 使用大模型：DeepSeek-V4.1-Flash | 功能名称：网页抓小球游戏 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页抓小球</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 返回首页入口 -->
  <nav class="HWH_topbar"><a href="../index.html">← 返回首页</a></nav>

  <!-- 顶部信息栏：分数、倒计时、开始按钮 -->
  <header class="info-bar">
    <div class="info-item">
      <span class="info-label">分数</span>
      <span id="score" class="info-value">0</span>
    </div>
    <div class="info-item">
      <span class="info-label">倒计时</span>
      <span id="timer" class="info-value">02:00</span>
    </div>
    <button id="start-btn" class="start-btn" type="button">开始游戏</button>
  </header>

  <!-- 游戏区：小球将在后续任务中动态生成在这里 -->
  <main id="game-area" class="game-area">
    <p id="guide-text" class="guide-text">点击【开始游戏】按钮开始挑战</p>
  </main>

  <script src="script.js"></script>
</body>
</html>
