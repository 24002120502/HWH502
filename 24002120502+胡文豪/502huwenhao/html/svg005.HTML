<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>svg图标</title>
    <!-- iconfont.js提供svg的symbol定义，路径注意文件在 css/font 目录下 -->
    <script src="../css/font/iconfont.js"></script>
    <link rel="stylesheet" href="../css/svg005.css">
</head>
<body>
    <h3>svg图标</h3>

    <div class="tab-nav">
        <!-- 点击时调用changeTab(this)，this指向当前被点击的元素 -->
        <div class="tab-item active" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-dizhi"></use>
            </svg>
            <span>地址</span>
            <div class="budge-dot" id="budge-address"></div>
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-sousuo"></use>
            </svg>
            <span>搜索</span>
            <div class="budge-num" id="budge-search">54</div>
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-baocun"></use>
            </svg>
            <span>保存</span>
            <div class="budge-num" id="budge-save">100</div>
        </div>

        <div class="tab-item" onclick="changeTab(this)">
            <svg class="icon" aria-hidden="true">
                <use xlink:href="#icon-shipin"></use>
            </svg>
            <span>视频</span>
            <div class="budge-border" id="budge-video"></div>
        </div>
    </div>

    <script>
    //写一个函数，当我点击当前的item时候，颜色发生变化
    function changeTab(current) {
        // 1. 先把所有tab的active类移除
        let tabs = document.querySelectorAll(".tab-item");
        for (let i = 0; i < tabs.length; i++) {
            tabs[i].classList.remove("active");
        }
        // 2. 再给当前点击的tab加上active类
        current.classList.add("active");
    }

    // 数字徽标超过99时显示"99+"，并加上max类（更宽的胶囊）
    let nums = document.querySelectorAll(".budge-num");
    for (let i = 0; i < nums.length; i++) {
        let count = parseInt(nums[i].textContent, 10);
        if (count > 99) {
            nums[i].textContent = "99+";
            nums[i].classList.add("max");
        }
    }
    </script>
</body>
</html>
