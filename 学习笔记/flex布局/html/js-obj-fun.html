<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // math对象
        console.log(Math.floor(1.9)); // 向下取整
        console.log(Math.ceil(1.1)); // 向上取整  
        console.log(Math.round(1.5)); // 四舍五入
        console.log(Math.max(1, 2, 3, 4, 5)); // 最大值
        console.log(Math.min(1, 2, 3, 4, 5)); // 最小值
        console.log(Math.random()); // 生成0-1之间的随机数
        function randomNum(min, max) {
            return Math.floor(Math.random() * (max - min + 1)) + min;
        }   
        console.log(randomNum(1, 10));
        var date = new Date();
        console.log(date.getFullYear()); // 获取年份
        console.log(date.getMonth() + 1); // 获取月份，注意月份是从0开始的，所以要加1
        console.log(date.getDate()); // 获取日期    
        console.log(date.getDay()); // 获取星期几，0是星期天，1是星期一，依次类推
        console.log(date.getHours()+":"+date.getMinutes()+":"+date.getSeconds()); // 获取小时
        console.log(date.getDay());
        console.log(date.getMinutes()); // 获取分钟
        console.log(date.getSeconds()); // 获取秒数
        console.log(date.getTime());    // 获取1970年1月1日0时0分0秒到当前时间的毫秒数
        //数组对象
        var arr = [1, 2, 3, 4, 5,'six'];
        var arr1 = new Array(1, 2, 3, 4, 5);
        console.log(arr); 
        console.log(arr1);
        console.log(new Array(5));
        var arr2 =  Array.of(5);
        console.log(arr2);
    
    </script>
</body>
</html>
